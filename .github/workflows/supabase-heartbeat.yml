name: Supabase Heartbeat

on:
  push:
    branches: [leetcode, main, master]
  schedule:
    # 每天 12:00 UTC — 7 天 pause 阈值下留足缓冲
    - cron: '0 12 * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: https://ovxaymldzdiatllhjbvx.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_H3ea5scu5VwoJAkA6ZDQtA_WTj-Eycq

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (with retry)
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL%/}/rest/v1/tag_defs?select=id&limit=1"
          MAX_ATTEMPTS=3
          RETRY_WAIT_SEC=30

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt ${attempt}/${MAX_ATTEMPTS} → ${URL}"
            if curl -sfS --connect-timeout 15 --max-time 30 "$URL" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"; then
              echo "✅ Supabase heartbeat OK"
              exit 0
            fi
            echo "⚠️ Attempt ${attempt} failed"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$RETRY_WAIT_SEC"
            fi
          done

          echo "::error::Supabase heartbeat failed after ${MAX_ATTEMPTS} attempts"
          exit 1
